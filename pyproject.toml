[project]
name = "agents-under-the-hood"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agents-under-the-hood = "agents_under_the_hood:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
